version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword       # Change this!
      MYSQL_DATABASE: userauthentication              # Optional
      MYSQL_USER: ecommerce                      # Optional
      MYSQL_PASSWORD: ecompassword              # Optional
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
